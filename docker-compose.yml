# Web UI in Docker. Settings and secrets come from .env next to this file (git-ignored);
# copy .env.example to .env and fill it in. The minimum:
#   APP_PASSWORD=...            the only login
#   REPLICATE_API_TOKEN=...     generation key
# The port is bound to localhost only; public access goes through nginx.
services:
  stickermotion:
    build: .
    image: stickermotion:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - stickermotion-data:/data
    ports:
      - "127.0.0.1:${STICKERMOTION_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  stickermotion-data:
